# 설치본 배포 — 윈도우 러너에서 NSIS 설치본을 만들어 GitHub Release에 붙인다.
# 트리거는 둘: v* 태그 푸시, 또는 Actions 탭의 "Run workflow"(workflow_dispatch). 어느 쪽이든
# Release 태그는 package.json의 version(v<버전>)이다 — 태그를 못 미는 환경에서도 Release가 나온다.
# 사이트 주소는 build.mjs 기본값(https://stargayte.vercel.app)이 박힌다.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run dist
      - name: 버전 읽기
        id: ver
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Release에 설치본 붙이기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 스타게이트 등록기 ${{ steps.ver.outputs.tag }}
          files: release/*.exe
          generate_release_notes: true
