appId: com.stargayte.uploader
productName: 스타게이트 등록기
directories:
  output: release
files:
  - dist/main.cjs
  - dist/preload.cjs
  - toast.html
  - toast.js
  - package.json
extraResources:
  - from: assets
    to: assets
npmRebuild: false
# 맥: 서명·공증 없이 낸다(결정: 무서명). electron-builder는 인증서가 없으면 서명을 통째로 건너뛰는데,
# Apple Silicon은 서명이 아예 없는 앱을 "손상됨"으로 거절하므로 afterPack에서 임시(ad-hoc) 서명만
# 입힌다. 사용자는 처음 한 번 시스템 설정 → 개인정보 보호 및 보안 → "그래도 열기"를 눌러야 한다.
afterPack: scripts/afterPack.cjs
mac:
  target:
    - target: dmg
      arch: [universal]
  icon: assets/icon.png
  category: public.app-category.utilities
  identity: null
  artifactName: "stargayte-uploader-${version}-mac.${ext}"
dmg:
  sign: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.png
  artifactName: "stargayte-uploader-setup-${version}.${ext}"
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  shortcutName: 스타게이트 등록기

# 자동 갱신(latest.yml) 발행은 안 한다 — 없으면 빌드 끝에 publish 단계가 null을 읽다 넘어진다.
publish: null
